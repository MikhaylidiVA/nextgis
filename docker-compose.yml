version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: nextgis-db
    restart: always
    environment:
      POSTGRES_DB: nextgisweb
      POSTGRES_USER: nextgis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgis -d nextgisweb"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextgisweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextgis-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Основные настройки NextGIS
      NGW_CONFIG_FILE: /etc/nextgisweb/production.ini
      
      # База данных
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nextgisweb
      DB_USER: nextgis
      DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
      
      # Администратор
      NGW_ADMIN_LOGIN: admin
      NGW_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      
      # Секретный ключ (нужно изменить в .env или переменных Portainer)
      SECRET_KEY: ${SECRET_KEY:-change_me_secret_key_12345}
      
      # Настройки брендинга (передаются как env, можно использовать в CSS через JS или генерацию)
      BRANDING_PRIMARY_COLOR: ${BRANDING_PRIMARY_COLOR:-#2c3e50}
      BRANDING_SECONDARY_COLOR: ${BRANDING_SECONDARY_COLOR:-#3498db}
      BRANDING_ACCENT_COLOR: ${BRANDING_ACCENT_COLOR:-#e74c3c}
      BRANDING_LOGO_TEXT: ${BRANDING_LOGO_TEXT:-NextGIS Custom}
      
    volumes:
      - ngw_data:/var/www/nextgisweb
      - ngw_config:/etc/nextgisweb
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  ngw_data:
  ngw_config:
