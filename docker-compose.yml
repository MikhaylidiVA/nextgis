version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: nextgis-db
    restart: always
    environment:
      POSTGRES_DB: nextgisweb
      POSTGRES_USER: nextgis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgis -d nextgisweb"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextgisweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextgis-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Настройки подключения к БД
      DB_HOST: db
      DB_NAME: nextgisweb
      DB_USER: nextgis
      DB_PASSWORD: ${DB_PASSWORD:-StrongPassword123!}
      
      # Админка
      NGW_ADMIN_LOGIN: admin
      NGW_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      
      # Секретный ключ
      SECRET_KEY: ${SECRET_KEY:-ChangeThisSecretKeyImmediately!}
      
    volumes:
      - ngw_data:/var/www/nextgisweb
      - ngw_config:/etc/nextgisweb
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # Долгий старт первой инициализации

volumes:
  pg_data:
  ngw_data:
  ngw_config:
