version: '3.8'

services:
  nextgisweb-db:
    image: postgis/postgis:15-3.4
    container_name: nextgisweb-db
    environment:
      POSTGRES_DB: nextgisweb
      POSTGRES_USER: nextgis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgis -d nextgisweb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextgis-net

  nextgisweb-app:
    build:
      context: .
      dockerfile: Dockerfile.nextgis
    container_name: nextgisweb-app
    depends_on:
      nextgisweb-db:
        condition: service_healthy
    environment:
      NGW_CONFIG_PATH: /etc/nextgisweb
      DB_HOST: nextgisweb-db
      DB_NAME: nextgisweb
      DB_USER: nextgis
      DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
      SECRET_KEY: ${SECRET_KEY:-change_me_secret_key}
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Переменные для кастомизации дизайна (передаются в контейнер)
      BRANDING_PRIMARY_COLOR: ${BRANDING_PRIMARY_COLOR:-#2c3e50}
      BRANDING_SECONDARY_COLOR: ${BRANDING_SECONDARY_COLOR:-#3498db}
      BRANDING_ACCENT_COLOR: ${BRANDING_ACCENT_COLOR:-#e74c3c}
      BRANDING_LOGO_TEXT: ${BRANDING_LOGO_TEXT:-NextGIS Custom}
    volumes:
      - ./customization/css/custom-theme.css:/var/www/nextgisweb/static/css/custom-theme.css:ro
      - ./customization/assets/logo.svg:/var/www/nextgisweb/static/img/logo.svg:ro
      - appdata:/var/www/nextgisweb/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nextgis-net
    restart: unless-stopped

  # Nginx прокси (опционально, можно убрать если не нужен)
  nextgisweb-proxy:
    image: nginx:alpine
    container_name: nextgisweb-proxy
    depends_on:
      - nextgisweb-app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - nextgis-net
    profiles:
      - production

volumes:
  pgdata:
  appdata:

networks:
  nextgis-net:
    driver: bridge
